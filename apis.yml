name: Its Good
description: >-
  It's Good is a social dining recommendation app that reimagines how people discover
  restaurants and bars by surfacing recommendations from trusted friends rather than
  crowdsourced reviews from strangers. Founded in 2023 and co-founded by Mike Rosenthal
  (CEO) and musician John Legend, the iOS app lets people save the places they love,
  organize their lists, and share personalized recommendations within a curated community
  of people they know and admire. The company is backed by a seed investment from
  Lightspeed Venture Partners. It's Good is a consumer mobile product and does not
  currently publish a public API or developer platform.
